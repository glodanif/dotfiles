# Force gnome-keyring backend so cookies/passwords decrypt correctly
# (auto-detect on Hyprland falls back to basic encryption and purges data)
--password-store=gnome-libsecret

# Don't hand Hyprland colour-management image descriptions: Brave tags plain SDR
# video (Twitch) as wide-gamut, so cm_auto_hdr flipped the TV to HDR (a modeset,
# black flash) on every fullscreen toggle. Real HDR goes through mpv instead.
--disable-features=WaylandWpColorManagerV1
