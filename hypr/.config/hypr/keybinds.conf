###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, W, killactive,
bind = $mainMod SHIFT, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, V, exec, hyprctl dispatch togglefloating active && hyprctl dispatch resizeactive exact 65% 65%
bind = $mainMod ALT, RETURN, fullscreen, 0
bind = $mainMod, SPACE, exec, $menu
# bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, P, exec, monitors-layout-toggle
bind = $mainMod, B, exec, $browser --enable-features=WebRTCPipeWireCapturer --profile-directory=Default
bind = $mainMod, T, exec, $terminal -e $tasks
bind = $mainMod, N, exec, swaync-client -t

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod ALT, SPACE, exec, walker --provider menus:main

# TAB cycles between windows (was hy3:togglefocuslayer)
bind = SUPER, TAB, cyclenext
bind = SUPER, TAB, bringactivetotop

# Move workspaces to other monitors
bindd = SUPER ALT, LEFT, Move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = SUPER ALT, RIGHT, Move workspace to right monitor, movecurrentworkspacetomonitor, r
bindd = SUPER ALT, UP, Move workspace to up monitor, movecurrentworkspacetomonitor, u
bindd = SUPER ALT, DOWN, Move workspace to down monitor, movecurrentworkspacetomonitor, d

# Move window within the layout
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, right, movewindow, r

# Move window, entering/leaving groups in the way (was hy3 "visible" variant)
bind = $mainMod CONTROL SHIFT, left, movewindoworgroup, l
bind = $mainMod CONTROL SHIFT, down, movewindoworgroup, d
bind = $mainMod CONTROL SHIFT, up, movewindoworgroup, u
bind = $mainMod CONTROL SHIFT, right, movewindoworgroup, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace,1
bind = $mainMod SHIFT, 2, movetoworkspace,2
bind = $mainMod SHIFT, 3, movetoworkspace,3
bind = $mainMod SHIFT, 4, movetoworkspace,4
bind = $mainMod SHIFT, 5, movetoworkspace,5
bind = $mainMod SHIFT, 6, movetoworkspace,6
bind = $mainMod SHIFT, 7, movetoworkspace,7
bind = $mainMod SHIFT, 8, movetoworkspace,8
bind = $mainMod SHIFT, 9, movetoworkspace,9
bind = $mainMod SHIFT, 0, movetoworkspace,10

# Window groups — native Hyprland tabbed groups (replaces hy3 containers)
bind = $mainMod, z, togglegroup                  # was hy3:makegroup tab
bind = $mainMod, d, layoutmsg, togglesplit       # was hy3:makegroup h (flip dwindle split)
bind = $mainMod, s, pseudo                       # was hy3:makegroup v (pseudotile)
bind = $mainMod, a, changegroupactive, f         # was hy3:changefocus raise
bind = $mainMod SHIFT, a, changegroupactive, b   # was hy3:changefocus lower
bind = $mainMod, x, lockactivegroup, toggle      # was hy3:locktab
bind = $mainMod, e, fullscreen, 1                # was hy3:expand (maximize)
bind = $mainMod SHIFT, e, fullscreen, 0          # was hy3:expand base
bind = $mainMod, r, moveoutofgroup               # was hy3:changegroup opposite

bind = , Print, exec, take-screenshot
bind = $mainMod SHIFT, V, exec, cliphist list | walker --dmenu | cliphist decode | wl-copy
bind = $mainMod, ESCAPE, exec, power-menu
bind = $mainMod, M, exec, mic-toggle

# Resize active window
bindd = SUPER, code:34, Expand window left, resizeactive, -100 0
bindd = SUPER, code:35, Shrink window left, resizeactive, 100 0
bindd = SUPER SHIFT, code:34, Shrink window up, resizeactive, 0 -100
bindd = SUPER SHIFT, code:35, Expand window down, resizeactive, 0 100

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
# Scroll over a group's titlebar to switch tabs (native groupbar)
bind = $mainMod, mouse_down, changegroupactive, b
bind = $mainMod, mouse_up, changegroupactive, f
# NOTE: hy3:warpcursor had no native equivalent — SUPER+Q is now free to rebind

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

bind = , SCROLL_LOCK, exec, voxtype record start
bindr = , SCROLL_LOCK, exec, voxtype record stop

# Alt+Shift switches keyboard layout on ALL keyboards, kept in sync by layout-switch
# (replaces xkb grp:alt_shift_toggle, which only switched the keyboard being pressed)
bind = ALT, SHIFT_L, exec, layout-switch
bind = ALT, SHIFT_R, exec, layout-switch
bind = SHIFT, ALT_L, exec, layout-switch
bind = SHIFT, ALT_R, exec, layout-switch

