exec-once = hyprpm reload -n
exec-once = pgrep -x pipewire > /dev/null || pipewire
exec-once = pgrep -x wireplumber > /dev/null || wireplumber
exec-once = pgrep -x pipewire-pulse > /dev/null || pipewire-pulse
exec-once = hyprpaper
exec-once = hypridle
exec-once = elephant
exec-once = waybar
exec-once = walker --gapplication-service
exec-once = mako
exec-once = headphones-watch
exec-once = urgent-watch
exec-once = usb-watch
exec-once = wl-clip-persist --clipboard regular
exec-once = wl-paste --watch cliphist store
exec-once = sleep 1 && /usr/lib/xdg-desktop-portal-hyprland
exec-once = sleep 2 && /usr/lib/xdg-desktop-portal --replace
exec-once = monitors-layout-restore
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11
exec-once = sh -c 'mkdir -p $XDG_RUNTIME_DIR/gcr && /usr/lib/gcr-ssh-agent --base-dir $XDG_RUNTIME_DIR/gcr'
exec-once = solaar --window=hide
exec-once = sleep 1 && discord --start-minimized
exec-once = sleep 1 && slack --startup
exec-once = Telegram -startintray
exec-once = voxtype daemon
exec-once = syncthing
exec-once = mic-pico-sync

