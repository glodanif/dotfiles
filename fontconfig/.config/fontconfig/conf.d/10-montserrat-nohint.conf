<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Montserrat's capital-T crossbar (~1px at 14px) gets quantized away
       by slight hinting in Pango/GTK; render it unhinted -->
  <match target="font">
    <test name="family" compare="contains"><string>Montserrat</string></test>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
